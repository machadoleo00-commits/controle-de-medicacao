{% extends "base.html" %}

{% block main %}

<h1>Editar Medicamento</h1>

<form method = "POST" action = "{{ url_for('editar', id=medicamento[0]) }}">
    <div>
        <label for="medicamento">Medicamento:</label>
        <input type="text" id="medicamento" name="medicamento" value="{{ medicamento[1] }}" required>
    </div>
        
    <div>
        <label for="posologia">Posologia (numero de tomadas no dia):</label>
        <input type="number" min='1' id="posologia" name="posologia" value="{{ medicamento[2] }}" required>
    </div>
    <div>
        <label for="tempo">dias de tratamento:</label>
        <input type="number" min ='1' id="tempo" name="tempo" value="{{ medicamento[3] }}" required>
    </div>  
    <button type="submit">Atualizar</button>
</form>

{% endblock %}
